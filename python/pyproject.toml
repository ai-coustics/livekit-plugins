[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-coustics-livekit"
version = "0.1.0"
description = "ai-coustics noise cancellation for LiveKit Agents"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "ai-coustics GmbH", email = "info@ai-coustics.com" }]
keywords = ["ai-coustics", "audio", "livekit", "noise-cancellation", "speech"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "aic-sdk>=2.5.0,<3",
  "livekit-agents>=1.4.2,<2",
  "numpy>=2.0.2",
]

[dependency-groups]
dev = [
  "mypy>=1.17",
  "pytest>=8.0",
  "ruff>=0.12",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"livekit.plugins.ai_coustics" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["livekit.plugins.ai_coustics"]

[[tool.mypy.overrides]]
module = "aic_sdk"
disable_error_code = ["type-arg"]
